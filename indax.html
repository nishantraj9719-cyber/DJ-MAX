<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ Introduction Card</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080812;
      font-family: Arial, sans-serif;
      color: white;
    }

    .dj-card {
      width: 340px;
      padding: 35px 25px;
      text-align: center;
      border-radius: 22px;
      background: linear-gradient(145deg, #17172d, #090912);
      border: 1px solid #ff00cc;
      box-shadow: 0 0 25px #ff00cc55,
                  0 0 50px #00e5ff22;
    }

    .dj-image {
  width: 120px;
  height: 120px;
  margin: 0 auto 20px;
  border-radius: 50%;
  overflow: hidden;
  border: 4px solid white;
  box-shadow: 0 0 25px #ff00cc;
  background: linear-gradient(135deg, #ff00cc, #00e5ff);
}

.dj-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
      

    .tag {
      color: #00e5ff;
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 34px;
      font-weight: 900;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 15px #ff00cc;
    }

    .role {
      margin: 12px 0;
      color: #ff00cc;
      font-size: 15px;
      font-weight: bold;
    }

    p {
      color: #c5c5d5;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .socials {
      margin-bottom: 25px;
    }

    .socials a {
      display: inline-block;
      color: #00e5ff;
      text-decoration: none;
      margin: 0 8px;
      font-size: 13px;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 30px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      background: linear-gradient(90deg, #ff00cc, #7b2cff);
      box-shadow: 0 0 18px #ff00cc66;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px #ff00cc;
    }

    .footer {
      margin-top: 25px;
      font-size: 10px;
      letter-spacing: 3px;
      color: #77778f;
    }
  </style>
</head>

<body>

  <div class="dj-card">

     <div class="dj-image">
     <img src="image.jpeg" alt="DJ Max Sound System">
     </div>

    <div class="tag">FEEL THE BEAT</div>

    <h1>DJ Max </h1>

    <div class="role">DJ • PRODUCER • SATYENDR RAJPUT </div>
    <div class="role">mo.7351819352.9720802021</div>

    <p>
      Book the dj every event
      1.Wedding Events 
      2. Birthday Parties
      3. School,College Events
      6. Festival,Special Events
    </p>

    <div class="socials">
      <a href="https://www.instagram.com/maxdj_rampura/"
   class="btn"
   target="_blank"
   rel="noopener noreferrer">Instagram</a>
  <a href="https://youtube.com/@newmaxdjrampura3939?si=UIO9f7TuUMqj-Oas"
         class="btn"
         target="_blank"
         rel="noopener noreferrer">YouTube</a>
    </div>

    <a href="tel:7351819352"
   class="btn">
  BOOK THE DJ
</a>
   
    <div class="footer">
      MUSIC • ENERGY • VIBES
    </div>

  </div>

</body>
</html>
